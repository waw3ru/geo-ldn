{% load static %}

<!DOCTYPE html>
<html lang="en-US" itemscope itemtype="http://schema.org/WebPage">
    <head>
        <title>{% block page_title %}{% endblock page_title %}</title>

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="index,follow" />

        <meta name="author" content="GEO Land Degradation Neutrality Flagship (GEO-LDN)" />
        <meta name="url" content="https://geo-ldn.org/" />

        <meta http-equiv="x-dns-prefetch-control" content="on" />
        <meta http-equiv="Cache-Control" content="max-age=604800,stale-while-revalidate=86400" />

        <!-- Twitter Card data https://dev.twitter.com/cards/overview -->
        {% comment %}
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:site" content="@TWITTER_ID" />
        <meta name="twitter:title" content="TITLE" />
        <meta name="twitter:description" content="DESCRIPTION" />
        <meta name="twitter:creator" content="@CREATOR" />
        <meta name="twitter:image" content="IMAGE_FOR_TWITTER_CARD" />
        {% endcomment %}

        <!-- Open Graph data http://ogp.me/ -->
        {% comment %}
        <meta property="og:title" content="TITLE" />
        <meta property="og:type" content="article" />
        <meta property="og:url" content="url" />
        <meta property="og:image" content="IMAGE_TO_USE" />
        <meta property="og:description" content="DESCRIPTION" />
        <meta property="og:site_name" content="SITE_NAME" />
        {% endcomment %}

        <link href="{% static 'zsk-assets/css/style.css' %}" rel="stylesheet" type="text/css" />
    </head>

    <body>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
            crossorigin="anonymous"
        ></script>

        <script defer async src="{% static 'zsk-assets/js/index.js' %}"></script>

        {% block page_content %} {% endblock %}
    </body>
</html>
